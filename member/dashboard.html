<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX Academy, Dashboard</title>
<link rel="stylesheet" href="../assets/lumina.css">
<script src="../assets/shell.js"></script>
<script src="../assets/lumina.js"></script>
<script src="../assets/seed.js"></script>
<style>
  .bento{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;}
  .col-4{grid-column:span 4;} .col-5{grid-column:span 5;} .col-6{grid-column:span 6;} .col-7{grid-column:span 7;} .col-8{grid-column:span 8;} .col-12{grid-column:span 12;}
  .mod{background:var(--c-lowest);border:1px solid var(--outline-var);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-sm);}
  .mod h3{font-size:15px;font-weight:700;white-space:nowrap;}
  .mod-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;}
  .welcome{background:linear-gradient(135deg,#0f3218,#0a1410);color:var(--d-ink);border:none;position:relative;overflow:hidden;}
  .mini{display:flex;gap:8px;}
  .stat{flex:1;background:var(--c-low);border-radius:var(--r);padding:12px;}
  .stat .v{font-family:var(--font-display);font-weight:700;font-size:22px;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;}
  .ai-chip{font-size:13px;font-weight:600;padding:7px 12px;border-radius:9999px;background:var(--c-low);border:1px solid var(--outline-var);cursor:pointer;transition:.12s;}
  .ai-chip:hover{background:var(--primary-container);border-color:var(--leaf);}
  .lock-mini{position:relative;}
  .checklist-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--c-high);}
  .cl-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--outline-var);flex:none;display:grid;place-items:center;}
  .cl-box.done{background:var(--lime);border-color:var(--lime);}
  .switch{display:inline-flex;background:var(--c);border-radius:9999px;padding:3px;gap:2px;}
  .switch a{font-size:12px;font-weight:700;padding:6px 12px;border-radius:9999px;color:var(--on-surface-var);}
  .switch a.on{background:var(--c-lowest);color:var(--primary);box-shadow:var(--shadow-sm);}
  /* Live prices (dark terminal card) */
  .px-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--d-outline);}
  .px-row:last-child{border-bottom:none;}
  .px-pair{font-family:var(--font-display);font-weight:700;font-size:14.5px;color:#fff;width:82px;flex:none;letter-spacing:-.01em;}
  .px-spark{width:62px;height:30px;flex:none;}
  .px-val{margin-left:auto;text-align:right;}
  .px-price{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--d-ink);font-variant-numeric:tabular-nums;transition:color .45s var(--ease);}
  .px-chg{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px;}
  .flash-up{color:var(--lime)!important;} .flash-dn{color:var(--neg-on-dark)!important;}
  /* Market news */
  .news-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--c-high);}
  .news-item:last-child{border-bottom:none;}
  .news-impact{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;}
  .imp-high{background:var(--neg);} .imp-med{background:var(--warn);} .imp-low{background:var(--leaf);}
  .news-head{font-weight:600;font-size:14px;line-height:1.42;text-wrap:pretty;}
  .news-head:hover{color:var(--primary);}
  .news-meta{font-size:12px;color:var(--on-surface-var);margin-top:4px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
  .news-legend{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--on-surface-var);}
  @media(max-width:1100px){.col-4,.col-5,.col-6,.col-7,.col-8{grid-column:span 12;}}

  /* ---- Performance module (v5, reference-adapted) ---- */
  .mod-in{opacity:0;animation:modIn .6s var(--ease) forwards;animation-delay:calc(var(--i,0)*50ms);}
  @keyframes modIn{from{opacity:0;transform:translateY(18px) scale(.985);}to{opacity:1;transform:none;}}
  .qa-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;}
  .qa-chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:9px 15px;border-radius:9999px;background:rgba(255,255,255,.08);border:1px solid var(--d-outline-strong);color:var(--d-ink);transition:transform .25s var(--ease),background .2s,border-color .2s;}
  .qa-chip:hover{background:rgba(195,243,92,.14);border-color:rgba(195,243,92,.5);transform:translateY(-2px);}
  .qa-chip.hot{background:var(--lime);color:var(--on-lime);border-color:transparent;}
  .qa-chip.hot:hover{background:var(--lime);filter:brightness(1.05);}
  /* filter pills */
  .fbar{display:flex;gap:18px;flex-wrap:wrap;align-items:center;grid-column:span 12;}
  .fgroup{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--on-surface-var);}
  .fseg{display:inline-flex;background:var(--c-lowest);border:1px solid var(--outline-var);border-radius:9999px;padding:3px;box-shadow:var(--shadow-sm);}
  .fseg button{border:0;background:transparent;font:700 12.5px Manrope;color:var(--on-surface-var);padding:7px 13px;border-radius:9999px;cursor:pointer;transition:color .2s,background .25s var(--ease),box-shadow .25s var(--ease);}
  .fseg button.on{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(15,50,24,.25);}
  .fcount{margin-left:auto;font-size:13px;font-weight:600;color:var(--on-surface-var);}
  /* tinted stat cards */
  .stat4{grid-column:span 3;border-radius:var(--r-lg);padding:22px;border:1px solid var(--outline-var);position:relative;overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .3s var(--ease),box-shadow .3s var(--ease);}
  .stat4:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
  .stat4.tint-pos{background:linear-gradient(150deg,#eef7e4 0%,#fbfdf6 62%);}
  .stat4.tint-neg{background:linear-gradient(150deg,#fbeae6 0%,#fdf8f5 62%);}
  .stat4.tint-neu{background:linear-gradient(150deg,#eef1ea 0%,#fbfcf8 62%);}
  .stat4 .s-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .stat4 .s-l{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--on-surface-var);}
  .stat4 .s-ic{width:38px;height:38px;border-radius:9999px;display:grid;place-items:center;background:rgba(15,50,24,.08);color:var(--primary);}
  .stat4.tint-neg .s-ic{background:rgba(186,26,26,.10);color:var(--neg);}
  .stat4 .s-v{font-family:var(--font-display);font-weight:800;font-size:32px;letter-spacing:-.02em;}
  .stat4 .s-sub{font-size:12.5px;color:var(--on-surface-var);margin-top:5px;}
  /* equity chart w/ axis */
  .eq-wrap{position:relative;}
  .eq-grid text{font:600 11px Manrope;fill:var(--on-surface-var);}
  .eq-grid line{stroke:var(--outline-var);stroke-dasharray:3 5;}
  /* P&L period bars */
  .plbars{display:flex;align-items:flex-end;gap:7px;height:190px;padding-top:26px;}
  .plb{flex:1;min-width:0;position:relative;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--lime-dim),#7fae2f);transform:scaleY(0);transform-origin:bottom;animation:plbIn .6s var(--ease) forwards;animation-delay:calc(var(--i,0)*30ms + .15s);cursor:pointer;transition:filter .2s;}
  .plb.neg{background:linear-gradient(180deg,#e08a80,var(--neg));border-radius:3px 3px 7px 7px;}
  .plb:hover{filter:brightness(1.1);}
  @keyframes plbIn{to{transform:scaleY(1);}}
  .plb .tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(4px);background:var(--c-lowest);border:1px solid var(--outline-var);border-radius:12px;box-shadow:var(--shadow-lg);padding:10px 13px;font-size:12px;line-height:1.55;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .25s var(--ease);z-index:10;}
  .plb:hover .tip{opacity:1;transform:translateX(-50%) translateY(0);}
  .plb .tip b{font-size:14px;display:block;}
  .plx{display:flex;gap:7px;margin-top:8px;}
  .plx span{flex:1;text-align:center;font-size:10.5px;color:var(--on-surface-var);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* donut sweep */
  .donut-in svg{animation:donutIn .8s var(--ease) both;}
  @keyframes donutIn{from{opacity:0;transform:rotate(-70deg) scale(.9);}to{opacity:1;transform:none;}}
  @media(max-width:1100px){.stat4{grid-column:span 6;}}
  @media(max-width:560px){.stat4{grid-column:span 12;}}
</style>
</head>

// Shared seed data — same numbers as Journal & Analytics
const DS = FXData.stats, FRI = FXData.byDow.find(d=>d.key==='Fri');
const BESTDOW = FXData.byDow.slice().sort((a,b)=>b.netR-a.netR)[0];

    <a href="onboarding.html" class="btn btn-ghost btn-sm" style="margin-top:14px;">Open full onboarding</a>

/* ---- Performance module (v5): filters → stats → equity → period bars + donut.
   All numbers derive from FXData.trades so they agree with Journal/Analytics. */
const FEND = FXData.trades[FXData.trades.length-1].date;
let PF = {range:'all', dir:'all', asset:'all', group:'daily'};

function perfShell(){
  return `
  <div class="fbar mod" style="background:none;border:0;box-shadow:none;padding:0;">
    <div class="fgroup">Range <span class="fseg" data-f="range">
      <button data-v="7">7D</button><button data-v="30">30D</button><button data-v="90">90D</button><button data-v="all" class="on">All</button></span></div>
    <div class="fgroup">Direction <span class="fseg" data-f="dir">
      <button data-v="all" class="on">All</button><button data-v="long">Long</button><button data-v="short">Short</button></span></div>
    <div class="fgroup">Asset <span class="fseg" data-f="asset">
      <button data-v="all" class="on">All</button><button data-v="fx">Forex</button><button data-v="gold">Gold</button></span></div>
    <div class="fgroup">Group by <span class="fseg" data-f="group">
      <button data-v="daily" class="on">Daily</button><button data-v="weekly">Weekly</button><button data-v="monthly">Monthly</button></span></div>
    <span class="fcount" id="fCount"></span>
  </div>
  <div class="stat4 tint-pos mod"><div class="s-head"><span class="s-l">Net result</span><span class="s-ic">R</span></div><div class="s-v num" id="sNet">—</div><div class="s-sub" id="sNetSub"></div></div>
  <div class="stat4 tint-pos mod"><div class="s-head"><span class="s-l">Win rate</span><span class="s-ic">◎</span></div><div class="s-v num" id="sWin">—</div><div class="s-sub" id="sWinSub"></div></div>
  <div class="stat4 tint-neu mod"><div class="s-head"><span class="s-l">Profit factor</span><span class="s-ic">↗</span></div><div class="s-v num" id="sPf">—</div><div class="s-sub" id="sPfSub"></div></div>
  <div class="stat4 tint-neg mod"><div class="s-head"><span class="s-l">Max drawdown</span><span class="s-ic">↘</span></div><div class="s-v num" id="sDd">—</div><div class="s-sub">peak to trough</div></div>
  <div class="mod col-12">
    <div class="mod-head"><h3>Equity curve</h3><span class="muted" style="font-size:12.5px;" id="eqMeta"></span></div>
    <div class="eq-wrap" id="eqChart" style="height:250px;"></div>
  </div>
  <div class="mod col-8">
    <div class="mod-head"><h3>Result by period</h3><span class="muted" style="font-size:12.5px;">hover a bar for detail</span></div>
    <div class="plbars" id="plBars"></div><div class="plx" id="plX"></div>
  </div>
  <div class="mod col-4">
    <div class="mod-head"><h3>Win / loss</h3></div>
    <div class="donut-in" id="wlDonut" style="display:grid;place-items:center;padding:8px 0;"></div>
    <div class="row gap3" style="justify-content:center;font-size:13px;" id="wlLegend"></div>
    <p class="muted" style="font-size:11.5px;text-align:center;margin:12px 0 0;">Educational data — not investment advice</p>
  </div>`;
}

function perfAgg(){
  const list = FXData.trades.filter(t=>{
    if(PF.range!=='all' && (FEND - t.date)/864e5 > +PF.range) return false;
    if(PF.dir!=='all' && t.dir!==PF.dir) return false;
    if(PF.asset==='fx' && t.pair==='XAUUSD') return false;
    if(PF.asset==='gold' && t.pair!=='XAUUSD') return false;
    return true;
  });
  const wins=list.filter(t=>t.outcome==='win'), losses=list.filter(t=>t.outcome==='loss');
  const grossW=wins.reduce((a,t)=>a+t.r,0), grossL=Math.abs(losses.reduce((a,t)=>a+t.r,0));
  let cum=0, peak=0, dd=0;
  const eq=list.map(t=>{cum=+(cum+t.r).toFixed(1); peak=Math.max(peak,cum); dd=Math.max(dd,+(peak-cum).toFixed(1)); return cum;});
  const M=FXData.MONTHS;
  const bkey = d => PF.group==='daily' ? M[d.getMonth()]+' '+d.getDate()
    : PF.group==='weekly' ? (()=>{const m=new Date(d); m.setDate(d.getDate()-((d.getDay()+6)%7)); return M[m.getMonth()]+' '+m.getDate();})()
    : M[d.getMonth()];
  const bmap = new Map();
  list.forEach(t=>{ const k=bkey(t.date); if(!bmap.has(k)) bmap.set(k,{label:k,r:0,n:0,w:0,l:0});
    const b=bmap.get(k); b.r=+(b.r+t.r).toFixed(1); b.n++; if(t.outcome==='win')b.w++; if(t.outcome==='loss')b.l++; });
  const cap = PF.group==='daily'?14:PF.group==='weekly'?12:6;
  const buckets=[...bmap.values()].slice(-cap);
  return {list, wins:wins.length, losses:losses.length, be:list.length-wins.length-losses.length,
    netR:+eq[eq.length-1]?.toFixed(1)||0,
    winRate:(wins.length+losses.length)?Math.round(wins.length/(wins.length+losses.length)*100):0,
    pf:grossL?+(grossW/grossL).toFixed(2):null, dd, eq, buckets};
}

function eqAxisChart(mount, eq){
  const W=mount.clientWidth||940, H=mount.clientHeight||250, PL=52, PR=14, PT=12, PB=24;
  if(eq.length<2){ mount.innerHTML='<p class="muted" style="padding:40px;text-align:center;">Not enough data for this filter.</p>'; return; }
  const min=Math.min(0,...eq), max=Math.max(...eq)||1, rng=(max-min)||1;
  const X=i=>PL+i*(W-PL-PR)/(eq.length-1), Y=v=>PT+(max-v)/rng*(H-PT-PB);
  let path=`M${X(0)},${Y(eq[0])}`;
  for(let i=1;i<eq.length;i++){const cx=(X(i-1)+X(i))/2; path+=` C${cx},${Y(eq[i-1])} ${cx},${Y(eq[i])} ${X(i)},${Y(eq[i])}`;}
  const gid='eqg'+Math.random().toString(36).slice(2,7);
  const steps=4, grid=Array.from({length:steps+1},(_,k)=>{const v=min+rng*k/steps;
    return `<line x1="${PL}" x2="${W-PR}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${PL-8}" y="${Y(v)+4}" text-anchor="end">${v>0?'+':''}${v.toFixed(0)}R</text>`;}).join('');
  mount.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8d642" stop-opacity=".35"/><stop offset="100%" stop-color="#a8d642" stop-opacity="0"/></linearGradient></defs>
    <g class="eq-grid">${grid}</g>
    <path d="${path} L${X(eq.length-1)},${H-PB} L${X(0)},${H-PB} Z" fill="url(#${gid})"/>
    <path d="${path}" fill="none" stroke="#7fae2f" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="${X(eq.length-1)}" cy="${Y(eq[eq.length-1])}" r="3.6" fill="#7fae2f" stroke="#fff" stroke-width="2"/>
  </svg>`;
  FX.drawChart(mount);
}

function renderPerf(){
  const A = perfAgg();
  document.getElementById('fCount').textContent = A.list.length+' of '+FXData.trades.length+' trades match';
  const cnt=(id,to,dec,pre,suf)=>{ const eln=document.getElementById(id);
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){ eln.textContent=pre+to.toFixed(dec)+suf; return; }
    const t0=performance.now(), dur=900;
    (function tick(t){const p=1-Math.pow(1-Math.min(1,(t-t0)/dur),3); eln.textContent=pre+(to*p).toFixed(dec)+suf; if(p<1)requestAnimationFrame(tick);})(t0);
  };
  cnt('sNet', A.netR, 1, A.netR>=0?'+':'', 'R');
  document.getElementById('sNet').style.color = A.netR>=0?'var(--primary)':'var(--neg)';
  document.getElementById('sNetSub').textContent = A.list.length+' trades · $'+Math.round(A.netR*100).toLocaleString()+' at $100 risk per R';
  cnt('sWin', A.winRate, 0, '', '%');
  document.getElementById('sWinSub').textContent = A.wins+'W / '+A.losses+'L / '+A.be+'BE';
  if(A.pf===null){ document.getElementById('sPf').textContent='—'; document.getElementById('sPfSub').textContent='not enough data'; }
  else { cnt('sPf', A.pf, 2, '', ''); document.getElementById('sPfSub').textContent='gross win R ÷ gross loss R'; }
  cnt('sDd', A.dd, 1, '−', 'R');
  document.getElementById('eqMeta').textContent = 'cumulative R · '+A.list.length+' trades';
  eqAxisChart(document.getElementById('eqChart'), A.eq);
  // period bars
  const mx = Math.max(...A.buckets.map(b=>Math.abs(b.r)),1);
  document.getElementById('plBars').innerHTML = A.buckets.map((b,i)=>{
    const h=Math.max(6, Math.abs(b.r)/mx*100);
    return `<div class="plb ${b.r<0?'neg':''}" style="height:${h}%;--i:${i};">
      <span class="tip"><b style="color:${b.r<0?'var(--neg)':'var(--primary)'};">${b.r>0?'+':''}${b.r.toFixed(1)}R</b>${b.label} · ${b.n} trade${b.n>1?'s':''}<br>win rate ${b.n?Math.round(b.w/Math.max(b.w+b.l,1)*100):0}%</span></div>`;
  }).join('');
  document.getElementById('plX').innerHTML = A.buckets.map(b=>`<span>${b.label}</span>`).join('');
  // donut
  const dn=document.getElementById('wlDonut'); dn.classList.remove('donut-in'); void dn.offsetWidth; dn.classList.add('donut-in');
  FX.donut(dn, {segments:[{value:A.wins,color:'#a8d642'},{value:A.losses,color:'#ba1a1a'},{value:Math.max(A.be,0.0001),color:'#c2c8bf'}], size:150, thickness:20, center:A.winRate+'%', centerSub:'win rate'});
  document.getElementById('wlLegend').innerHTML = [['var(--lime-dim)','Wins '+A.wins],['var(--neg)','Losses '+A.losses],['var(--outline-var)','BE '+A.be]]
    .map(([c,t])=>`<span class="row gap1"><span style="width:9px;height:9px;border-radius:3px;background:${c};"></span>${t}</span>`).join('');
}

// Apple-crisp entrance choreography: every module settles in sequence
[].slice.call(bento.children).forEach(function(c,i){ c.style.setProperty('--i', Math.min(i,12)); c.classList.add('mod-in'); });

/* ---- Live prices ticker ---- */
const PAIRS=[
  {s:'EUR/USD', p:1.0842, dp:4, vol:0.0006, chg:0.18},
  {s:'GBP/USD', p:1.2715, dp:4, vol:0.0007, chg:-0.12},
  {s:'USD/JPY', p:156.38, dp:2, vol:0.06,   chg:0.34},
  {s:'XAU/USD', p:2341.2, dp:2, vol:1.10,   chg:0.92},
  {s:'BTC/USD', p:67420,  dp:0, vol:70,     chg:2.14},
  {s:'AUD/USD', p:0.6648, dp:4, vol:0.0005, chg:-0.27},
];
const fmt=(v,dp)=>v.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
function renderPrices(){
  const host=document.getElementById('pxList'); if(!host) return;
  PAIRS.forEach(p=>{
    p.open = p.p/(1+p.chg/100);
    p.series = Array.from({length:22},(_,k)=>p.open*(1+(Math.sin(k/3.2)*0.4+(Math.random()-0.5))*(p.vol/p.p)*5));
    p.series[p.series.length-1]=p.p;
  });
  host.innerHTML = PAIRS.map((p,i)=>{
    const up=p.chg>=0;
    return `<div class="px-row">
      <span class="px-pair">${p.s}</span>
      <div class="px-spark" id="spk${i}"></div>
      <div class="px-val">
        <div class="px-price" id="pp${i}">${fmt(p.p,p.dp)}</div>
        <div class="px-chg" id="pc${i}" style="color:${up?'var(--lime)':'var(--neg-on-dark)'}">${up?'▲':'▼'} ${Math.abs(p.chg).toFixed(2)}%</div>
      </div>
    </div>`;
  }).join('');
  PAIRS.forEach((p,i)=>FX.spark(document.getElementById('spk'+i), p.series, p.chg>=0?'#a8d642':'#ff897d'));
}
function tickPrices(){
  if(document.hidden || !document.getElementById('pxList')) return;
  PAIRS.forEach((p,i)=>{
    const prev=p.p;
    p.p = Math.max(p.p + (Math.random()-0.48)*p.vol*2, p.vol);
    p.chg = (p.p-p.open)/p.open*100;
    p.series.push(p.p); if(p.series.length>22) p.series.shift();
    const up=p.chg>=0, ppEl=document.getElementById('pp'+i), pcEl=document.getElementById('pc'+i);
    ppEl.textContent=fmt(p.p,p.dp);
    const cls=p.p>=prev?'flash-up':'flash-dn';
    ppEl.classList.add(cls); setTimeout(()=>ppEl.classList.remove(cls),520);
    pcEl.style.color=up?'var(--lime)':'var(--neg-on-dark)';
    pcEl.textContent=(up?'▲':'▼')+' '+Math.abs(p.chg).toFixed(2)+'%';
    FX.spark(document.getElementById('spk'+i), p.series, up?'#a8d642':'#ff897d');
  });
}
renderPrices();
if(document.getElementById('pxList')) setInterval(tickPrices, 2200);
